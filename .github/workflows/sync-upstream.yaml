name: Sync upstream

# Merges new commits from the original repository (Caps3n/hass-norish) into
# this fork's main branch, so HACS picks them up as an update.
# If the merge conflicts with local changes the job fails and GitHub sends
# a notification; resolve it manually in that case.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository != 'Caps3n/hass-norish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Caps3n/hass-norish.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin main
